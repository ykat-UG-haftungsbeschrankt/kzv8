[package]
name = "kz-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kernel"
path = "kernel/main.rs"
test = false
bench = false

[dependencies]
libm = "0.2"
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[features]
default = ["fpu-sse"]
fpu-x87 = []
fpu-sse = []
fpu-avx = ["fpu-sse"]
aarch64-fpu-off = []

[workspace]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 2