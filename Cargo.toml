[package]
name = "kz-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kernel"
path = "kernel/main.rs"
test = false
bench = false

[dependencies]
libm = "0.2"
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[features]
default = ["fpu-sse"]
ebpf-jit = []
beam-jit = []
fpu-x87 = []
fpu-sse = []
fpu-avx = ["fpu-sse"]
aarch64-fpu-off = []
runtime-v8 = []
virtualization = []
intel-vtx = ["virtualization"]
intel-vtx-lock-feature-control = ["intel-vtx"]
intel-vtd = ["virtualization"]
intel-vmdq = ["virtualization"]
intel-sriov = ["virtualization"]
intel-ddio = ["virtualization"]
amd-v = ["virtualization"]
aarch64-stage2 = ["virtualization"]
aarch64-vhe = ["aarch64-stage2"]
virtualization-minimal = ["virtualization", "intel-vtx", "amd-v", "aarch64-vhe"]
virtualization-full = [
	"virtualization",
	"intel-vtx",
	"intel-vtd",
	"intel-vmdq",
	"intel-sriov",
	"intel-ddio",
	"amd-v",
	"aarch64-vhe",
]
virtualization-both = ["virtualization-minimal", "virtualization-full"]

[workspace]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 2